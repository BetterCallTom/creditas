name: credita

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credita
      POSTGRES_PASSWORD: credita
      POSTGRES_DB: credita
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credita -d credita"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://credita:credita@postgres:5432/credita?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      AUTH_SERVICE_URL: http://auth-service:8080
      SCORE_SERVICE_URL: http://score-service:8080
      CONSULTA_SERVICE_URL: http://consulta-service:8080
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - score-service
      - consulta-service

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      JWT_SECRET: credita-dev-secret

  score-service:
    build:
      context: .
      dockerfile: score-service/Dockerfile
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://credita:credita@postgres:5432/credita?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SCORE_LATENCY: "0ms"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  consulta-service:
    build:
      context: .
      dockerfile: consulta-service/Dockerfile
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://credita:credita@postgres:5432/credita?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: consultas
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  notification-worker:
    build:
      context: .
      dockerfile: notification-worker/Dockerfile
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: consultas
      KAFKA_GROUP: notification-worker
      WORKER_PROCESS_DELAY: "500ms"
    depends_on:
      kafka:
        condition: service_healthy
