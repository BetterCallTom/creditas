apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: creditas-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BetterCallTom/creditas.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: creditas-prod
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
