apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.16.1
    helm:
      valuesObject:
        grafana:
          persistence:
            enabled: true
            size: 1Gi
            storageClassName: local-path
          service:
            type: NodePort
            nodePort: 30300

        prometheus:
          service:
            type: NodePort
            nodePort: 30900
          prometheusSpec:
            retention: 2d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

        alertmanager:
          alertmanagerSpec:
            secrets:
              - alertmanager-discord-webhook
          config:
            route:
              receiver: "null"
              group_by:
              - alertname
              - service
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
              - receiver: discord
                matchers:
                - alertname =~ "Creditas.*"
            receivers:
            - name: "null"
            - name: discord
              discord_configs:
              - send_resolved: true
                webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/url
                title: |
                  🚨 {{ .CommonLabels.alertname }}
                message: |
                  {{- range .Alerts }}
                  **Alerta**: {{ .Annotations.summary }}
                  {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
