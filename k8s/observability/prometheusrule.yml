apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: creditas-alerts
spec:
  groups:
  - name: creditas.rules
    rules:
    - alert: Taxa elevada de erros
      expr: |
        sum by (service, namespace) (rate(http_requests_total{namespace=~"creditas-.*",status=~"5.."}[5m]))
        /
        sum by (service, namespace) (rate(http_requests_total{namespace=~"creditas-.*"}[5m]))
        > 0.05
      for: 2m
      labels:
        severity: critical
      annotations:
        descricao: |
          O serviço **{{ $labels.service }}** ({{ $labels.namespace }}) está com **{{ $value | humanizePercentage }}** de erros 5xx

    - alert: Alta latência
      expr: |
        histogram_quantile(0.95, sum by (le, service, namespace) (rate(http_request_duration_seconds_bucket{namespace=~"creditas-.*"}[5m]))) > 0.001
      for: 1m
      labels:
        severity: warning
      annotations:
        descricao: |
          O serviço **{{ $labels.service }}** ({{ $labels.namespace }}) está com latência p95 de **{{ $value | humanizeDuration }}**

    - alert: Back-end offline
      expr: up{job=~"creditas-.*/creditas-apps"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        descricao: |
          O pod **{{ $labels.pod }}** ({{ $labels.namespace }}) está **FORA DO AR**