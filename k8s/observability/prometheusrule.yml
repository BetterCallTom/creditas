apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: creditas-alerts
spec:
  groups:
  - name: creditas.rules
    rules:
    - alert: CreditasHighErrorRate
      expr: |
        sum by (service, namespace) (rate(http_requests_total{namespace=~"creditas-.*",status=~"5.."}[5m]))
        /
        sum by (service, namespace) (rate(http_requests_total{namespace=~"creditas-.*"}[5m]))
        > 0.05
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: Taxa de erro 5xx acima de 5% em {{ $labels.service }}
    - alert: CreditasHighLatencyP95
      expr: |
        histogram_quantile(0.95, sum by (le, service, namespace) (rate(http_request_duration_seconds_bucket{namespace=~"creditas-.*"}[5m]))) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Latencia p95 acima de 1s em {{ $labels.service }}
    - alert: CreditasTargetDown
      expr: up{job=~"creditas-.*/creditas-apps"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Pod {{ $labels.pod }} sem responder metricas
