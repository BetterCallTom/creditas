apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
- prometheusrule.yml

configMapGenerator:
  - name: creditas-app-dashboard
    files:
      - creditas-app.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"