apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: creditas-dev
resources:
- ../../base
replicas:
- count: 1
  name: auth-service
- count: 1
  name: score-service
- count: 1
  name: consulta-service
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    group: argoproj.io
    kind: Rollout
    name: gateway
images:
- name: localhost/creditas/auth-service
  newName: ghcr.io/bettercalltom/creditas/auth-service
  newTag: v7
- name: localhost/creditas/consulta-service
  newName: ghcr.io/bettercalltom/creditas/consulta-service
  newTag: v7
- name: localhost/creditas/gateway
  newName: ghcr.io/bettercalltom/creditas/gateway
  newTag: v7
- name: localhost/creditas/notification-worker
  newName: ghcr.io/bettercalltom/creditas/notification-worker
  newTag: v7
- name: localhost/creditas/score-service
  newName: ghcr.io/bettercalltom/creditas/score-service
  newTag: v7
