apiVersion: v1
kind: ConfigMap
metadata:
  name: creditas-config
  namespace: creditas
data:
  PORT: "8080"
  LOG_LEVEL: info
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: consultas
  REDIS_URL: redis://redis:6379/0
  TZ: America/Sao_Paulo
---
apiVersion: v1
kind: Secret
metadata:
  name: creditas-secret
  namespace: creditas
type: Opaque
stringData:
  JWT_SECRET: creditas-dev-secret
  DATABASE_URL: postgres://credita:credita@postgres:5432/credita?sslmode=disable
