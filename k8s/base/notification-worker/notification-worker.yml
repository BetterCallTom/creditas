apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: creditas
  labels:
    app: notification-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      initContainers:
        - name: create-topic
          image: apache/kafka:4.4.0
          command:
            - /bin/sh
            - -c
            - until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic consultas --partitions 1 --replication-factor 1; do sleep 3; done

      containers:
      - name: notification-worker
        image: localhost/creditas/notification-worker:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: creditas-config
        env:
        - name: KAFKA_GROUP
          value: notification-worker
        - name: WORKER_PROCESS_DELAY
          value: 500ms
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
