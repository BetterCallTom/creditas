apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: creditas
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: localhost/creditas/gateway:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: creditas-config
        env:
        - name: AUTH_SERVICE_URL
          value: http://auth-service:8080
        - name: SCORE_SERVICE_URL
          value: http://score-service:8080
        - name: CONSULTA_SERVICE_URL
          value: http://consulta-service:8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: creditas
spec:
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
