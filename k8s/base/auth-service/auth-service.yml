apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: creditas
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: localhost/creditas/auth-service:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: creditas-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: creditas-secret
              key: JWT_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: creditas
spec:
  selector:
    app: auth-service
  ports:
  - port: 8080
    targetPort: 8080
