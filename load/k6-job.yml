apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load
  namespace: creditas-dev
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: k6
        image: grafana/k6:2.3.0
        args:
        - run
        - /scripts/k6-script.js
        env:
        - name: BASE_URL
          value: http://gateway:8080
        - name: BURN_MS
          value: "200"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: script
          mountPath: /scripts
      volumes:
      - name: script
        configMap:
          name: k6-script
