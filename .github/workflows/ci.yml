name: ci

on:
  push:
    branches:
    - main
    paths-ignore:
    - k8s/**
    - gitops/**

concurrency:
  group: ci
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY_PATH: ghcr.io/bettercalltom/creditas

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: go vet ./...
    - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
        - auth-service
        - consulta-service
        - gateway
        - notification-worker
        - score-service
    steps:
    - uses: actions/checkout@v7
    - run: |
        echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
        echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ matrix.service }}/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY_PATH }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          ${{ env.REGISTRY_PATH }}/${{ matrix.service }}:${{ env.SHA_TAG }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  update-manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
    - run: echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
    - working-directory: k8s/overlays/dev
      run: |
        for service in auth-service consulta-service gateway notification-worker score-service; do
          kustomize edit set image "localhost/creditas/${service}=${REGISTRY_PATH}/${service}:${IMAGE_TAG}"
        done
    - run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add k8s/overlays/dev
        git commit -m "ci: atualiza imagens para ${IMAGE_TAG}"
        git push